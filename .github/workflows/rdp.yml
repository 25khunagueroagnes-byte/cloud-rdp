name: Windows RDP & SSH (Tailscale)

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Windows Server Runner Version'
        required: true
        type: choice
        options:
          - windows-2025
          - windows-2022
        default: windows-2025
      auto_relay:
        description: 'Auto-relay to spawn replacement runner at minute 330'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  secure-rdp:
    runs-on: ${{ inputs.os_version || 'windows-2025' }}
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Open firewall port 3389 for RDP
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

      - name: Configure OpenSSH Server (Headless Agent Access)
        shell: powershell
        run: |
          # Ensure OpenSSH Server is enabled and running for headless agent/CLI access
          try {
              $sshd = Get-Service -Name sshd -ErrorAction SilentlyContinue
              if (-not $sshd) {
                  Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction SilentlyContinue
              }
              Set-Service -Name sshd -StartupType 'Automatic'
              Start-Service sshd
              netsh advfirewall firewall delete rule name="SSH-Tailscale" 2>$null
              netsh advfirewall firewall add rule name="SSH-Tailscale" `
                dir=in action=allow protocol=TCP localport=22
              Write-Host "OpenSSH Server configured and active on port 22."
          } catch {
              Write-Warning "OpenSSH Server setup warning: $_"
          }

      - name: Create RDP User
        shell: powershell
        run: |
          # Disable Windows Server password complexity so simple passwords like '2222' are accepted
          secedit /export /cfg "$env:TEMP\secpol.cfg"
          (Get-Content "$env:TEMP\secpol.cfg") -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' `
                                              -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY
          Remove-Item "$env:TEMP\secpol.cfg", "$env:TEMP\secpol.sdb" -Force -ErrorAction SilentlyContinue

          $password = "${{ secrets.RDP_PASSWORD || '2222' }}"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          } else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          $installerPath = "$env:TEMP\tailscale.msi"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Write-Host "Downloading Tailscale from $url"
          curl.exe -fL "$url" -o $installerPath
          if (-not (Test-Path $installerPath)) {
              Write-Error "Could not download Tailscale installer."
              exit 1
          }

          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          # Connect to Tailscale using repository secret
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --unattended --accept-routes

          # Retrieve assigned Tailscale IP address
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null).Trim()
              if ($tsIP) { break }
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale connection failed. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify Network Services
        shell: powershell
        run: |
          $rdpTest = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $rdpTest.TcpTestSucceeded) {
              Write-Error "Service verification failed."
              exit 1
          }
          Write-Host "Network services verified successfully."

      - name: Maintain Connection & Keep Alive
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          AUTO_RELAY: ${{ inputs.auto_relay }}
          OS_VERSION: ${{ inputs.os_version || 'windows-2025' }}
        run: |
          Write-Host "`n==============================================="
          Write-Host "       WINDOWS CLOUD RUNNER ACTIVE"
          Write-Host "==============================================="
          Write-Host "Environment: $env:OS_VERSION"
          Write-Host "Network    : Private Mesh Active"
          Write-Host "Auto-Relay : $env:AUTO_RELAY"
          Write-Host "===============================================`n"

          $elapsed = 0
          while ($true) {
              $elapsed += 5
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Session Active ($elapsed min elapsed)..."

              # Auto-relay handover check at minute 330 (5.5 hours)
              if ($env:AUTO_RELAY -eq "true" -and $elapsed -ge 330) {
                  Write-Host "`n[Auto-Relay] 330 minutes reached. Spawning successor runner..."
                  try {
                      gh workflow run rdp.yml --repo $env:GITHUB_REPOSITORY -f auto_relay=true -f os_version=$env:OS_VERSION
                      Write-Host "[Auto-Relay] Successor triggered successfully. Waiting 60s before clean exit..."
                      Start-Sleep -Seconds 60
                      exit 0
                  } catch {
                      Write-Warning "[Auto-Relay] Failed to spawn successor: $_"
                  }
              }

              Start-Sleep -Seconds 300
          }

      - name: Emergency State Trap
        if: always()
        shell: powershell
        run: |
          Write-Host "[Emergency Trap] Runner termination detected or timeout reached."
          Write-Host "[Emergency Trap] Completed teardown/checkpoint step."
